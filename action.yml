name: 'grue build and push'
description: 'Build a Docker image with docker/build-push-action and push it to S3-compatible storage using grue.'
author: 'Simple Observability'

inputs:
  # Build (passed through to docker/build-push-action)
  context:
    description: 'Build context directory'
    default: '.'
  file:
    description: 'Path to the Dockerfile, relative to the context'
    default: './Dockerfile'
  tags:
    description: |
      Newline-delimited list of image references to build and push.
      Example:
        myimage:latest
        myimage:1.0.0
    required: true
  build-args:
    description: 'Newline-delimited list of build-time variables (passed to docker/build-push-action)'
    default: ''
  target:
    description: 'Set the target build stage to build'
    default: ''
  platform:
    description: 'Target platform (e.g. linux/amd64). Single platform only — grue stores one image per tag.'
    default: ''
  cache-from:
    description: 'List of cache sources (passed to docker/build-push-action)'
    default: ''
  cache-to:
    description: 'Cache destinations (passed to docker/build-push-action)'
    default: ''
  # S3 configuration
  endpoint:
    description: 'S3 endpoint URL (e.g. s3.amazonaws.com)'
    default: ''
  region:
    description: 'S3 region (e.g. us-east-1; blank if unused)'
    default: ''
  bucket:
    description: 'S3 bucket name'
    default: ''
  prefix:
    description: 'Key prefix inside the bucket (default: grue/)'
    default: 'grue/'
  access-key:
    description: 'S3 access key'
    default: ''
  secret-key:
    description: 'S3 secret key'
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build image
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        tags: ${{ inputs.tags }}
        build-args: ${{ inputs.build-args }}
        target: ${{ inputs.target }}
        platforms: ${{ inputs.platform }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}
        push: false
        load: true

    - name: Download grue
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ACTION_REPO: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -eu
        repo="${ACTION_REPO}"
        ref="${ACTION_REF}"

        os="$(uname -s | tr '[:upper:]' '[:lower:]')"
        arch="$(uname -m)"
        case "$arch" in
          x86_64|amd64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
        esac

        # Resolve the ref to a release tag. Exact release tags (vX.Y.Z)
        # and major tags (vX) are supported.
        tag="$ref"
        if ! gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
          if ! [[ "$ref" =~ ^v?[0-9]+$ ]]; then
            echo "::error::Ref '${ref}' of ${repo} is not a release tag (vX.Y.Z) or major tag (vX). Pin the action to a release or major tag." >&2
            exit 1
          fi
          tag="$(gh api "repos/${repo}/releases?per_page=100" \
            --jq "[.[] | select(.draft == false and .prerelease == false)]
                  | sort_by(.created_at) | reverse
                  | map(select(.tag_name | startswith(\"${ref}.\"))) | .[0].tag_name")"
          if [[ -z "$tag" ]]; then
            echo "::error::No stable release found for major tag '${ref}' in ${repo}" >&2
            exit 1
          fi
        fi
        echo "Using grue release: ${tag} (ref: ${ref})"

        gh release download "$tag" --repo "$repo" \
          --pattern "grue-${os}-${arch}" --output /usr/local/bin/grue
        chmod +x /usr/local/bin/grue
        grue --help >/dev/null

    - name: Push with grue
      shell: bash
      env:
        TAGS: ${{ inputs.tags }}
        # Map inputs → GRUE_* env vars (input takes priority over a pre-set env).
        GRUE_ENDPOINT: ${{ inputs.endpoint }}
        GRUE_REGION: ${{ inputs.region }}
        GRUE_BUCKET: ${{ inputs.bucket }}
        GRUE_PREFIX: ${{ inputs.prefix }}
        GRUE_ACCESS_KEY: ${{ inputs.access-key }}
        GRUE_SECRET_KEY: ${{ inputs.secret-key }}
      run: |
        set -eu
        mapfile -t tag_lines <<<"$TAGS"
        for line in "${tag_lines[@]}"; do
          t="$(echo "$line" | xargs)"
          [[ -z "$t" ]] && continue
          echo "::group::grue push $t"
          grue push "$t"
          echo "::endgroup::"
        done
